[workspace]
resolver = "3"
members = ["crates/loong-motion", "crates/loong-ui", "crates/loong-shell", "crates/loong-sysd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wesloong/loong-os"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# 体积优先：系统组件要尽量小。
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
