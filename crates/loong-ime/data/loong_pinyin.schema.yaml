# Rime schema
# encoding: utf-8
#
# Loong OS 默认中文输入方案：全拼，输出简体中文。
#
# 与 Rime 自带的 luna_pinyin_simp（朙月拼音·简化字）用法相同，区别是：
# - 词典换成 loong_pinyin：朙月拼音的字表 + 过滤后的预设词汇（见 loong_pinyin.dict.yaml），
#   编译后约 8MB（朙月拼音约 23MB）；
# - 不带笔画反查与自定义短语，不依赖 stroke 等其他方案的数据。
#
# 由 crates/loong-ime 维护（data/loong_pinyin.schema.yaml），随系统镜像的 Rime 数据包发布。

schema:
  schema_id: loong_pinyin
  name: 拼音
  version: "1.0"
  author:
    - Loong OS
  description: |
    Loong OS 默认拼音方案（全拼，简体输出）。词典数据来自朙月拼音与八股文（LGPL-3.0）。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: zh_simp
    reset: 1
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - simplifier
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    __patch:
      - pinyin:/abbreviation
      - pinyin:/spelling_correction
      - pinyin:/key_correction

translator:
  dictionary: loong_pinyin
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

simplifier:
  option_name: zh_simp

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
