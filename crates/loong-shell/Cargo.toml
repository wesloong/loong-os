[package]
name = "loong-shell"
description = "Loong OS 系统界面：Wayland 合成器、主屏、手势与物理动画"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.89"

[dependencies]
loong-motion = { path = "../loong-motion" }
loong-ui = { path = "../loong-ui" }
loong-ime = { path = "../loong-ime" }
anyhow = "1"
libc = "0.2"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Loong 私有协议（protocols/loong-app-v1.xml）的服务端代码生成。
wayland-scanner = "0.31"
# loong-sysd 客户端（状态栏电量 / Wi‑Fi、控制中心）：与 loong-sysd 用同一份 zbus 5（async-io，
# 不引入 tokio），在后台线程里运行；以下几个都是 zbus 本来就依赖的。
zbus = { version = "5.19", default-features = false, features = ["async-io"] }
async-io = "2"
async-channel = "2"
futures-lite = { version = "2", default-features = false, features = ["std"] }

[dependencies.smithay-drm-extras]
git = "https://github.com/Smithay/smithay.git"
rev = "f581531d479cf2e3307bafb913c5d2bb12860bb3"
default-features = false

[dependencies.smithay]
# 固定到经过验证的提交，升级时统一测试。
git = "https://github.com/Smithay/smithay.git"
rev = "f581531d479cf2e3307bafb913c5d2bb12860bb3"
default-features = false
features = [
    "backend_egl",
    "backend_drm",
    "backend_gbm",
    "backend_gbm_has_fd_for_plane",
    "backend_gbm_has_create_with_modifiers2",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
]

[dev-dependencies]
# 集成测试中的 Wayland 测试客户端（tests/subsurface.rs）。
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }

[[test]]
# 测试程序本身兼作测试客户端（--client），需要自己的 main。
name = "subsurface"
harness = false

[[test]]
# 自适应状态栏：真实客户端（共享内存、dmabuf、loong_app_v1）在无屏幕 loong-shell 中的效果。
name = "statusbar"
harness = false

[lints]
workspace = true
