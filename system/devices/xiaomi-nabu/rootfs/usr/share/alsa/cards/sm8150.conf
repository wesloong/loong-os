#
# Loong OS：小米平板 5（nabu）声卡的 ALSA 默认设备
#
# alsa-lib 按声卡的驱动名加载 /usr/share/alsa/cards/<驱动名>.conf（与 HDA-Intel.conf 等相同的机制）。nabu 的声卡
# 驱动名是 sm8150、长名 “Xiaomi Pad 5”（UCM 配置也按这两个名字查找：ucm2/conf.d/sm8150/Xiaomi Pad 5.conf）。
# 按驱动名而不是按声卡 ID 写，ID 由内核从长名生成，不必写死。
#
# 这块声卡没有自带的配置，default 原本直接打开硬件设备（plughw），同一时间只能有一个程序放音：第二个网页进程的
# alsasink 打不开设备，autoaudiosink 退回 fakesink，没有声音。这里让 default 经过混音：
#   放音  dmix：PCM 设备 0（MultiMedia1，即 UCM 里 Speaker 的 PlaybackPCM "hw:${CardId},0"）
#   录音  dsnoop：PCM 设备 1（MultiMedia2，UCM 里 Mic 的 CapturePCM "hw:${CardId},1"）
# 混音的格式固定为 48 kHz、S16_LE、立体声（ADSP 的 TDM 后端也是 48 kHz）；plug 负责采样率与格式转换。
# 周期与缓冲用 dmix 的默认值（1024 帧一个周期，周期数由驱动限制，q6asm 最多 8 个：约 170 ms 缓冲）。
#
# dmix 在进程之间用 SysV 共享内存与信号量（ipc_key、ipc_perm 0660、ipc_gid audio，见 alsa.conf 的 defaults.pcm），
# 各进程以 O_APPEND 方式共用同一个硬件 PCM，不需要服务进程。WPE WebKit 的网页进程沙箱（bubblewrap）不隔离 IPC
# 命名空间，所以各网页进程、各应用共用同一个 dmix。以后换成 PipeWire 时删掉本文件即可（PipeWire 直接按 UCM 打开 hw）。
#

sm8150.pcm.!default {
	@args [ CARD ]
	@args.CARD {
		type string
	}
	type asym
	playback.pcm {
		type plug
		slave.pcm {
			@func concat
			strings [ "dmix:CARD=" $CARD ",DEV=0,FORMAT=S16_LE,RATE=48000" ]
		}
	}
	capture.pcm {
		type plug
		slave.pcm {
			@func concat
			strings [ "dsnoop:CARD=" $CARD ",DEV=1,FORMAT=S16_LE,RATE=48000" ]
		}
	}
}
