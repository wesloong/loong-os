<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Loong OS：网页常写的思源黑体其他名字（Google Fonts 的 “Noto Sans SC”、Adobe 的 “Source Han Sans”、
     中文名）都用镜像里的 Noto Sans CJK SC 子集。binding="same" 是强别名：WebKit 只接受族名相同或
     强别名的匹配，否则会跳到字体栈里的下一个字体。 -->
<fontconfig>
	<alias binding="same">
		<family>Noto Sans SC</family>
		<accept><family>Noto Sans CJK SC</family></accept>
	</alias>
	<alias binding="same">
		<family>Source Han Sans SC</family>
		<accept><family>Noto Sans CJK SC</family></accept>
	</alias>
	<alias binding="same">
		<family>Source Han Sans CN</family>
		<accept><family>Noto Sans CJK SC</family></accept>
	</alias>
	<alias binding="same">
		<family>思源黑体</family>
		<accept><family>Noto Sans CJK SC</family></accept>
	</alias>
	<alias binding="same">
		<family>思源黑体 CN</family>
		<accept><family>Noto Sans CJK SC</family></accept>
	</alias>
</fontconfig>
