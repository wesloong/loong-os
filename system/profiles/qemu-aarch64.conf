# 机型配置：QEMU aarch64 虚拟平板（virt 机器，验证 ARM64 构建与启动链）
# 由 system/mkimage/mkimage.sh 以 shell 方式读取。
# 在 x86_64 宿主机上构建需要 qemu-user binfmt（tools/setup-binfmt.sh）和交叉编译的 loong-shell
# （tools/build-aarch64.sh）；运行：tools/qemu.py start <镜像> --arch aarch64。

PROFILE_NAME="QEMU aarch64 虚拟平板"
ARCH=aarch64

# 启动后端：uefi-sdboot（UEFI（edk2）→ systemd-boot → 每个 slot 一个 UKI）
BOOT_BACKEND=uefi-sdboot
KERNEL_PKG=linux-virt
KERNEL_IMAGE=/boot/vmlinuz-virt
EFI_ARCH=aa64

# initramfs 需要的内核模块（按顺序加载，依赖自动解析；内建的会被跳过）
INITRAMFS_MODULES="virtio_pci virtio_blk erofs ext4"

# rootfs 里保留的内核模块：与 qemu-x86_64 相同（同一个 linux-virt 内核）
KERNEL_MODULES="
	drivers/virtio/* drivers/block/virtio_blk.* drivers/char/hw_random/virtio-rng.*
	drivers/gpu/drm/virtio/* drivers/gpu/drm/tiny/bochs.*
	drivers/input/evdev.* drivers/input/mousedev.* drivers/input/misc/uinput.* drivers/hid/*
	drivers/net/virtio_net.* drivers/acpi/button.* drivers/firmware/*
	drivers/md/dm-mod.* drivers/md/dm-verity.* drivers/block/loop.* drivers/block/zram/*
	fs/erofs/* fs/ext4/* fs/fat/* fs/efivarfs/* fs/squashfs/* fs/overlayfs/* fs/binfmt_misc.*
	fs/nls/nls_cp437.* fs/nls/nls_iso8859-1.* fs/nls/nls_utf8.* fs/nls/nls_ascii.*
	net/packet/af_packet.*
	arch/*/crypto/* crypto/* lib/*
"

# 内核命令行（slot 由 mkimage 追加）
# virt 机器的串口是 PL011（ttyAMA0）；最后一个 console= 成为 /dev/console，启动日志走串口
CMDLINE="console=tty1 console=ttyAMA0,115200 quiet loglevel=3 psi=1 panic=10"
SERIAL_TTY=ttyAMA0

# 机型特有的软件包
DEVICE_PKGS=""

# 图形栈：loong = 自编的 mesa-loong（softpipe + virgl，aarch64 包里另有 freedreno；不依赖 LLVM，
# 见 system/packages/mesa-loong；在 x86_64 上构建 aarch64 包见 docs/devices/xiaomi-nabu.md）；
# distro = Alpine 的 mesa（llvmpipe 在 QEMU 里快得多，但连同 LLVM 多出约 200 MiB）。
# QEMU 只用于开发，默认用 distro：softpipe 在 TCG 下比 llvmpipe 慢 5–8 倍（打开设置约 6.5 分钟 vs 85 秒）。
# 体积按真机（xiaomi-nabu，默认 loong）计算；要在 QEMU 里验证 mesa-loong：MESA_FLAVOR=loong system/mkimage/mkimage.sh qemu-aarch64
MESA_FLAVOR=${MESA_FLAVOR:-distro}

# 虚拟显卡没有 3D 加速（virtio-gpu 无 virgl）：Mesa 直接用软件渲染（LIBGL_ALWAYS_SOFTWARE，
# loong-shell 走 kms_swrast，驱动是 softpipe；MESA_FLAVOR=distro 时是 llvmpipe）。合成器在软件渲染时
# linux-dmabuf 不公布 GPU 设备（只有 v3 格式表），WebKit 拿不到 DRM 设备，缓冲走共享内存；网页即使用 GL
# 也只是软件模拟、没有收益，所以保留
# WEBKIT_SKIA_ENABLE_CPU_RENDERING（无屏幕测试中去掉它也能正常显示）。有 GPU 的机型（nabu）不设这两个变量：
# loong-shell 的 linux-dmabuf feedback 把 render node 告诉 WebKit，网页在 GPU 上渲染、零拷贝提交。
SESSION_ENV="LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_SKIA_ENABLE_CPU_RENDERING=1"

# 开发镜像：串口 root 免密登录，便于调试
DEV_IMAGE=1

# 分区大小（MiB）
ESP_MB=64
DATA_MB=512
