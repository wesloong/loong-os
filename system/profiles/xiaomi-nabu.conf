# 机型配置：小米平板 5（nabu，骁龙 860 / SM8150）
# 由 system/mkimage/mkimage.sh 以 shell 方式读取。刷机与回滚见 docs/devices/xiaomi-nabu.md。
#
# 参数来源：pmaports（gitlab.nura.eco/nura/pmaports，v26.06 分支）的 device-xiaomi-nabu/deviceinfo，
# 分区大小来自 nabu 的 Android 设备树（BoardConfig.mk）。

PROFILE_NAME="小米平板 5（nabu）"
ARCH=aarch64

# 启动后端：android-abl（高通 ABL → boot_a/boot_b 中的 boot.img → super 中的 system_a/system_b）
BOOT_BACKEND=android-abl

# 内核与固件来自 postmarketOS（已更名 Nura）v26.06，它与 Alpine 3.24 二进制兼容。
# 仓库加了 @pmos 标签：只有显式写成 <包名>@pmos 的包（及其依赖）才会从这里安装，
# 两边同名的包（如 xkeyboard-config）仍然用 Alpine 的。
EXTRA_REPOS="@pmos https://mirror.nura.eco/postmarketos/v26.06"
# 公钥取自 pmaports 的 main/postmarketos-keys（sha512 与其 APKBUILD 一致）
EXTRA_KEYS="system/keys/build.postmarketos.org.rsa.pub"

KERNEL_PKG="linux-postmarketos-qcom-sm8150@pmos"
KERNEL_IMAGE=/boot/vmlinuz
# 设备树附加在内核后面（deviceinfo_append_dtb）
DTB=qcom/sm8150-xiaomi-nabu
APPEND_DTB=1

# 相当于 loong-device-xiaomi-nabu 包的依赖（不装 device-xiaomi-nabu / postmarketos-base）：
#   firmware-xiaomi-nabu    GPU、DSP、Wi‑Fi 等固件
#   qbootctl                A/B slot 切换与“启动成功”标记（由 loong-boot-ok 调用，不启用它自带的服务）
#   tqftpserv、pd-mapper、rmtfs  远程处理器（ADSP/CDSP/modem）需要的 QRTR 服务；Wi‑Fi（WCN3990）
#                           由 modem 子系统承载，音频由 ADSP 承载
#   alsa-ucm-conf           音频路由（nabu 的 UCM 文件在 system/devices/xiaomi-nabu/ 中）
DEVICE_PKGS="
	firmware-xiaomi-nabu@pmos
	pd-mapper@pmos pd-mapper-openrc@pmos
	qbootctl
	tqftpserv tqftpserv-openrc
	rmtfs rmtfs-openrc
	alsa-ucm-conf
"
# 图形栈：自编的 mesa-loong（freedreno 驱动 Adreno 640，不依赖 LLVM），见 system/packages/mesa-loong；
# 在 x86_64 开发机上构建 aarch64 包见 docs/devices/xiaomi-nabu.md。MESA_FLAVOR=distro 换回 Alpine 的 mesa。
MESA_FLAVOR=${MESA_FLAVOR:-loong}
# 与 pmOS 的 device-xiaomi-nabu-openrc 一致：tqftpserv 在 boot 级别启动
DEVICE_SERVICES="tqftpserv:boot pd-mapper:default rmtfs:default"

# 根文件系统：pmOS 的 sm8150 内核没有开启 erofs（CONFIG_EROFS_FS 未设置），暂用 squashfs（lz4hc，内建）。
# 换成开启 erofs（以及 dm-verity）的内核后改回 erofs，见 docs/devices/xiaomi-nabu.md。
ROOT_FS=squashfs

# initramfs 需要的内核模块（这个内核里都是内建的；mkimage 会检查它们存在）：动态分区映射、根与数据文件系统
INITRAMFS_MODULES="dm_mod squashfs ext4"

# 内核命令行（slot 由 mkimage 追加；boot.img v0 的 cmdline 最长 512 字节）
# console=tty0 放最后：initramfs 的提示与救援 shell 显示在屏幕上（可接 USB 键盘）
CMDLINE="console=ttyMSM0,115200 console=tty0 quiet loglevel=3 psi=1 panic=10"
SERIAL_TTY=ttyMSM0

# 适配阶段的开发镜像：root 免密
DEV_IMAGE=1

# 分区：根在 super 的逻辑分区 system_a / system_b 中，数据在 userdata
ROOT_PART=system_
DATA_PART=userdata
SUPER_PART=super
# super 分区大小（字节，BOARD_SUPER_PARTITION_SIZE）。flash.sh 刷机前会用 fastboot 核对
SUPER_SIZE=9126805504
FASTBOOT_PRODUCT=nabu

# boot.img 参数（deviceinfo_flash_*；未指定 header_version，即 v0）。boot 分区 128 MiB
BOOTIMG_HEADER_VERSION=0
BOOTIMG_BASE=0x00000000
BOOTIMG_KERNEL_OFFSET=0x00008000
BOOTIMG_RAMDISK_OFFSET=0x01000000
BOOTIMG_SECOND_OFFSET=0x00f00000
BOOTIMG_TAGS_OFFSET=0x00000100
BOOTIMG_PAGESIZE=4096
BOOTIMG_MAX_BYTES=134217728

# userdata 镜像中 ext4 的初始大小（MiB）；首次启动后由 loong-growfs 扩展到整个分区
DATA_MB=512
