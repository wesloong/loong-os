<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  loong-sysd（org.loong.System1 与 org.loong.Update1）的系统总线策略。

  - 只有 root 可以占用服务名。
  - 所有用户都可以读取属性、内省、调用只读方法（Power.Refresh、Wifi.GetNetworks、Update1.Status）。
  - 写操作只允许 root 与会话用户 loong（uid 1000）。loong-sysd 内部还会用
    GetConnectionUnixUser 按 uid 复核，这里是第一道关。
  - Agent 接口（net.connman.iwd.Agent）只给 iwd（root）回调。

  两个服务名由同一个进程占用，规则必须写在同一个文件里：send_destination 匹配接收方占用的
  任何一个名字，分成两个文件的话，一个文件里的“全部放行”会盖掉另一个文件里的禁止规则
  （而 system.d 里文件的加载顺序没有保证）。

  接口说明见 docs/api/loong-sysd.md、docs/api/loong-update.md。
-->
<busconfig>
  <policy user="root">
    <allow own="org.loong.System1"/>
    <allow own="org.loong.Update1"/>
    <allow send_destination="org.loong.System1"/>
    <allow send_destination="org.loong.Update1"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.loong.System1"/>
    <allow send_destination="org.loong.Update1"/>

    <deny send_destination="org.loong.System1"
          send_interface="org.loong.System1.Backlight" send_member="SetBrightness"/>
    <deny send_destination="org.loong.System1"
          send_interface="org.loong.System1.Wifi" send_member="SetEnabled"/>
    <deny send_destination="org.loong.System1"
          send_interface="org.loong.System1.Wifi" send_member="Scan"/>
    <deny send_destination="org.loong.System1"
          send_interface="org.loong.System1.Wifi" send_member="Connect"/>
    <deny send_destination="org.loong.System1"
          send_interface="org.loong.System1.Wifi" send_member="Disconnect"/>
    <deny send_destination="org.loong.System1"
          send_interface="org.loong.System1.Wifi" send_member="Forget"/>
    <deny send_destination="org.loong.System1"
          send_interface="org.freedesktop.DBus.Properties" send_member="Set"/>
    <deny send_destination="org.loong.System1"
          send_interface="net.connman.iwd.Agent"/>

    <deny send_destination="org.loong.Update1"
          send_interface="org.loong.Update1" send_member="Inspect"/>
    <deny send_destination="org.loong.Update1"
          send_interface="org.loong.Update1" send_member="Apply"/>
    <deny send_destination="org.loong.Update1"
          send_interface="org.loong.Update1" send_member="Cancel"/>
    <deny send_destination="org.loong.Update1"
          send_interface="org.loong.Update1" send_member="Rollback"/>
    <deny send_destination="org.loong.Update1"
          send_interface="org.freedesktop.DBus.Properties" send_member="Set"/>
  </policy>

  <policy user="loong">
    <allow send_destination="org.loong.System1"
           send_interface="org.loong.System1.Backlight" send_member="SetBrightness"/>
    <allow send_destination="org.loong.System1"
           send_interface="org.loong.System1.Wifi" send_member="SetEnabled"/>
    <allow send_destination="org.loong.System1"
           send_interface="org.loong.System1.Wifi" send_member="Scan"/>
    <allow send_destination="org.loong.System1"
           send_interface="org.loong.System1.Wifi" send_member="Connect"/>
    <allow send_destination="org.loong.System1"
           send_interface="org.loong.System1.Wifi" send_member="Disconnect"/>
    <allow send_destination="org.loong.System1"
           send_interface="org.loong.System1.Wifi" send_member="Forget"/>
    <allow send_destination="org.loong.Update1"
           send_interface="org.loong.Update1" send_member="Inspect"/>
    <allow send_destination="org.loong.Update1"
           send_interface="org.loong.Update1" send_member="Apply"/>
    <allow send_destination="org.loong.Update1"
           send_interface="org.loong.Update1" send_member="Cancel"/>
    <allow send_destination="org.loong.Update1"
           send_interface="org.loong.Update1" send_member="Rollback"/>
  </policy>
</busconfig>
