<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2e5e74">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>输入测试 · 山居笔记</title>
<style>
  body { margin: 0; font: 17px/1.6 "Noto Sans CJK SC", sans-serif; background: #fbf8f1; color: #2a2824; }
  header { padding: 24px 32px 8px; }
  h1 { font: 32px/1.3 "LXGW WenKai Screen", serif; margin: 0 0 4px; }
  .row { display: flex; gap: 16px; align-items: center; padding: 8px 32px; flex-wrap: wrap; }
  button, select, input { font: inherit; }
  button { padding: 10px 20px; border-radius: 10px; border: 0; background: #2e5e74; color: #fff; }
  input { padding: 8px 12px; border: 1px solid #b4aea2; border-radius: 8px; width: 280px; }
  #log { margin: 8px 32px; padding: 12px 16px; background: #eae3d3; border-radius: 10px; font: 14px/1.5 monospace; min-height: 3em; white-space: pre-wrap; }
  ol { margin: 16px 32px; padding-left: 2em; }
  li { padding: 10px 0; border-bottom: 1px solid #e0d8c6; }
</style>
</head>
<body>
<header>
  <h1>山居笔记 · 输入测试</h1>
  <div>本页用于测试浏览器的点按、键盘、触摸滚动与对话框。</div>
</header>
<div class="row">
  <button id="btn">点我</button>
  <input id="text" placeholder="在这里输入">
  <select id="sel"><option>宣纸</option><option>夜墨</option><option>熟宣</option></select>
  <button id="alert">弹出对话框</button>
  <button id="fs">全屏</button>
  <a href="page2.html">下一页 →</a>
  <a href="page2.html" target="_blank">新标签页打开</a>
</div>
<div id="log">（事件记录）</div>
<ol id="list"></ol>
<script>
  const log = (s) => { const l = document.getElementById('log'); l.textContent = (s + '\n' + l.textContent).split('\n').slice(0, 6).join('\n'); };
  let n = 0;
  document.getElementById('btn').addEventListener('click', () => log('点击 ×' + (++n)));
  document.getElementById('text').addEventListener('input', (e) => log('输入：' + e.target.value));
  document.getElementById('sel').addEventListener('change', (e) => log('选择：' + e.target.value));
  document.getElementById('alert').addEventListener('click', () => { const ok = confirm('要把这页收进书房吗？'); log('确认：' + ok); });
  document.getElementById('fs').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
  addEventListener('fullscreenchange', () => log('全屏：' + !!document.fullscreenElement));
  addEventListener('pointerdown', (e) => log(`pointerdown ${e.pointerType} (${Math.round(e.clientX)}, ${Math.round(e.clientY)})`));
  addEventListener('touchstart', (e) => log(`touchstart (${Math.round(e.touches[0].clientX)}, ${Math.round(e.touches[0].clientY)})`), { passive: true });
  addEventListener('keydown', (e) => log('keydown ' + e.key));
  addEventListener('scroll', () => { document.title = '输入测试 · 滚动 ' + Math.round(scrollY); }, { passive: true });
  const poems = ['空山新雨后，天气晚来秋。', '明月松间照，清泉石上流。', '竹喧归浣女，莲动下渔舟。', '随意春芳歇，王孙自可留。'];
  const list = document.getElementById('list');
  for (let i = 0; i < 60; i++) { const li = document.createElement('li'); li.textContent = `第 ${i + 1} 行　${poems[i % 4]}`; list.append(li); }
</script>
</body>
</html>
