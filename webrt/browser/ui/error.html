<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 出错页模板：loong-browser 替换 {{TITLE}} {{MESSAGE}} {{URL}}（已转义）后以出错网址的身份载入，
     因此不能引用本地文件，样式全部内联（色值与 LoongKit 令牌一致）。 -->
<title>{{TITLE}}</title>
<style>
  @font-face { font-family: "Loong Display"; src: local("LXGW WenKai Screen"), local("LXGW WenKai"); }
  :root {
    color-scheme: light dark;
    --paper: #f3eee2; --title: #141310; --label: #2a2824; --secondary: #4a4741; --fill: rgb(42 40 36 / 0.08);
    --zhusha: #b83a2b; --on-accent: #faf6ec; --control: #2a2824; --on-control: #fbf8f1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #15140f; --title: #e6e0d2; --label: #cfc8b8; --secondary: #a39d90; --fill: rgb(207 200 184 / 0.09); --control: #c8a45a; --on-control: #15140f; }
  }
  html { background: var(--paper); color: var(--label); font: 400 17px/1.6 "Inter", "Noto Sans CJK SC", sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
  main { max-width: 520px; padding: 48px 32px; text-align: center; animation: bloom 746ms cubic-bezier(.2, .8, .2, 1) both; }
  .seal {
    display: inline-block; writing-mode: vertical-rl; padding: 6px 5px; margin-bottom: 20px;
    border-radius: 5px 4px 6px 4px; background: var(--zhusha); color: var(--on-accent);
    font: 400 17px/1.05 "Loong Display", serif; letter-spacing: .04em;
  }
  h1 { margin: 0 0 10px; font: 400 28px/36px "Loong Display", serif; color: var(--title); letter-spacing: .08em; }
  p { margin: 0 0 8px; color: var(--secondary); text-wrap: balance; }
  .url { font: 13px/20px ui-monospace, monospace; color: var(--secondary); opacity: .8; overflow-wrap: anywhere; margin-bottom: 28px; }
  button {
    min-height: 44px; padding: 0 24px; border: 0; border-radius: 12px; background: var(--control); color: var(--on-control);
    font: 500 16px/1 "Inter", "Noto Sans CJK SC", sans-serif; letter-spacing: .02em;
  }
  button:active { transform: scale(.96); }
  @keyframes bloom { from { opacity: 0; filter: blur(8px); transform: scale(.985); } }
  @media (prefers-reduced-motion: reduce) { main { animation-duration: 1ms; } }
</style>
</head>
<body>
<main>
  <div class="seal" aria-hidden="true">迷途</div>
  <h1>{{TITLE}}</h1>
  <p>{{MESSAGE}}</p>
  <p class="url">{{URL}}</p>
  <button onclick="location.reload()">重新加载</button>
</main>
</body>
</html>
