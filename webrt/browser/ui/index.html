<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 浏览器界面（chrome）。由 loong-browser 加载到最上层的子表面；平时只占顶部工具栏，
     弹出菜单、对话框时临时铺满窗口（背景透明，下面是网页内容）。 -->
<title>浏览器</title>
<link rel="stylesheet" href="../../loongkit/loongkit.css">
<link rel="stylesheet" href="chrome.css">
<script src="../../loongkit/loongkit.js" defer></script>
<script src="chrome.js" defer></script>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- 符号：Lucide（ISC），见 crates/loong-ui/assets/icons/LICENSE -->
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-forward" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-reload" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 2v13"/><path d="m16 6-4-4-4 4"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></symbol>
  <symbol id="i-square-plus" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
  <symbol id="i-tabs" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
</svg>

<div class="chrome" id="chrome">
  <div class="toolbar" role="toolbar" aria-label="浏览器工具栏">
    <div class="tools tools--lead">
      <button class="tool" data-ink id="back" aria-label="后退" disabled><svg class="loong-symbol"><use href="#i-back"/></svg></button>
      <button class="tool" data-ink id="forward" aria-label="前进" disabled><svg class="loong-symbol"><use href="#i-forward"/></svg></button>
      <button class="tool" data-ink id="reload" aria-label="重新加载"><svg class="loong-symbol"><use href="#i-reload"/></svg></button>
    </div>

    <div class="center">
      <form class="address" id="address" role="search" autocomplete="off">
        <svg class="loong-symbol address-icon" id="address-icon" aria-hidden="true"><use href="#i-search"/></svg>
        <span class="address-label" id="address-label" aria-hidden="true"></span>
        <input class="address-input" id="address-input" type="text" inputmode="url" enterkeyhint="go"
               spellcheck="false" autocapitalize="off" aria-label="网址或搜索词" placeholder="搜索或输入网址">
        <!-- 加载进度：一笔浓墨从左往右写过去，写完后墨迹淡去 -->
        <span class="ink-progress" id="progress" aria-hidden="true"></span>
      </form>
      <button class="cancel" id="cancel" type="button" tabindex="-1">取消</button>
    </div>

    <div class="tools tools--trail">
      <button class="tool" data-ink id="share" aria-label="分享" aria-haspopup="menu"><svg class="loong-symbol"><use href="#i-share"/></svg></button>
      <button class="tool" data-ink id="new-tab" aria-label="新建标签页"><svg class="loong-symbol"><use href="#i-plus"/></svg></button>
    </div>
  </div>

  <div class="tabstrip" id="tabstrip" role="tablist" aria-label="标签页"></div>
</div>

<!-- 浮层：界面铺满窗口时才出现 -->
<div class="scrim" id="scrim" hidden></div>

<div class="popover loong-card loong-card--raised" id="share-menu" role="menu" hidden>
  <button class="loong-row" role="menuitem" id="install"><span class="loong-tile" style="--loong-pigment: var(--loong-color-zhusha)"><svg class="loong-symbol"><use href="#i-square-plus"/></svg></span><span class="loong-row-title">添加到主屏幕</span></button>
  <button class="loong-row" role="menuitem" id="copy-link"><span class="loong-tile" style="--loong-pigment: var(--loong-color-shiqing)"><svg class="loong-symbol"><use href="#i-link"/></svg></span><span class="loong-row-title">拷贝链接</span></button>
</div>

<div class="dialog" id="dialog" role="alertdialog" aria-modal="true" hidden>
  <div class="dialog-body">
    <h2 class="dialog-title" id="dialog-title"></h2>
    <p class="dialog-message" id="dialog-message"></p>
    <input class="dialog-input" id="dialog-input" type="text" hidden>
  </div>
  <div class="dialog-buttons">
    <button class="dialog-button" id="dialog-cancel">取消</button>
    <button class="dialog-button dialog-button--primary" id="dialog-ok">好</button>
  </div>
</div>

<div class="select-menu loong-card loong-card--raised" id="select-menu" role="listbox" hidden></div>

<div class="toast loong-card loong-card--raised" id="toast" role="status" hidden>
  <span class="loong-seal loong-seal--small" id="toast-seal">成</span>
  <span id="toast-text"></span>
</div>
</body>
</html>
