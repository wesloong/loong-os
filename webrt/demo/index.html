<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d9488">
<title>欢迎使用 Loong OS</title>
<link rel="stylesheet" href="../loongkit/loongkit.css">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
  main { width: min(720px, 90vw); }
  h1 { font-size: 34px; margin: 0 0 8px; }
  p { color: var(--loong-secondary-label); font-size: 17px; line-height: 1.5; margin: 0 0 20px; }
  .row { display: flex; gap: 16px; align-items: center; margin-top: 24px; }
  .track { position: relative; height: 72px; background: var(--loong-grouped-background); border-radius: 36px; margin-top: 16px; }
  .ball {
    position: absolute; top: 8px; left: 8px; width: 56px; height: 56px; border-radius: 50%;
    background: var(--loong-accent);
    transition: transform var(--loong-spring-bouncy-duration) var(--loong-spring-bouncy-easing);
  }
  .track.on .ball { transform: translateX(calc(min(720px, 90vw) - 40px - 16px - 56px)); }
  .meta { font-size: 13px; color: var(--loong-secondary-label); margin-top: 16px; }
</style>
</head>
<body>
<main class="loong-card">
  <h1>欢迎使用 Loong OS</h1>
  <p>这是一个由 WPE WebKit 渲染的 Web 应用。下面的小球使用与系统界面相同的弹簧参数（由 loong-motion 生成 CSS <code>linear()</code> 缓动），在 WebKit 的合成线程上运行。</p>
  <div class="track" id="track"><div class="ball"></div></div>
  <div class="row">
    <button class="loong-button" id="go">弹一下</button>
    <span class="meta" id="ua"></span>
  </div>
</main>
<script>
  const track = document.getElementById('track');
  document.getElementById('go').addEventListener('click', () => track.classList.toggle('on'));
  document.getElementById('ua').textContent = navigator.userAgent.replace(/\s*\(.*?\)\s*/, ' ');
  // 页面加载后自动演示一次，便于截图验证。
  setTimeout(() => track.classList.add('on'), 600);
</script>
</body>
</html>
